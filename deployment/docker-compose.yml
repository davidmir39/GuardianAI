# =====================================================================
# GuardianAI -- Despliegue (Hitos 4 y 5)
#
# Cinco servicios coordinados por dos volumenes (./shared/artifacts y
# ./shared/logs):
#
#  1. bootstrap  - one-shot. Si la carpeta de artefactos esta vacia,
#                  siembra el modelo preentrenado desde ../models/.
#                  Lo hace plug-and-play: el usuario puede levantar
#                  inferencia sin haber entrenado antes.
#  2. training   - perfil 'train'. Lee /data/raw/Base.csv y escribe
#                  modelo + preprocesador + metadatos en /artifacts.
#  3. inference  - servicio principal. FastAPI + uvicorn en el puerto
#                  8000. Solo lectura sobre /artifacts; escribe los
#                  logs JSONL de predicciones y feedback (Hito 5).
#  4. prometheus - scrapea /metrics de inference cada 15s. UI en :9090.
#  5. monitor    - bucle de monitorizacion (CPU, RAM, drift, F1, alertas
#                  por Telegram). Dispara reentrenamiento y /reload si
#                  RETRAIN_ON_DRIFT=true.
#
# Comandos rapidos:
#   docker compose up                          # los 4 servicios base
#   docker compose --profile train up training # re-entrenar
#   docker compose down                        # parar todo
# =====================================================================

services:

  bootstrap:
    image: busybox:1.36
    container_name: guardianai-bootstrap
    restart: "no"
    command:
      - sh
      - -c
      - |
        set -e
        if [ ! -f /artifacts/modelo_final.joblib ]; then
          echo "[bootstrap] Sembrando artefactos preentrenados desde /seed/ ..."
          cp -v /seed/modelo_final.joblib /artifacts/
          cp -v /seed/preprocesador.joblib /artifacts/
          cp -v /seed/metadatos.json /artifacts/
          echo "[bootstrap] Listo."
        else
          echo "[bootstrap] Artefactos ya presentes en /artifacts. Skip."
        fi
    volumes:
      - ./shared/artifacts:/artifacts
      - ../models:/seed:ro

  training:
    build:
      context: ./training
      dockerfile: Dockerfile
    image: guardianai-training:latest
    container_name: guardianai-training
    profiles: ["train"]
    restart: "no"
    environment:
      DATASET_PATH: /data/raw/Base.csv
      ARTIFACTS_DIR: /artifacts
      REPORTS_DIR: /artifacts/reports
      SEARCH_MODE: ${SEARCH_MODE:-quick}
      SEARCH_N_ITER: ${SEARCH_N_ITER:-30}
      SEARCH_CV_FOLDS: ${SEARCH_CV_FOLDS:-3}
      RANDOM_STATE: ${RANDOM_STATE:-42}
      N_JOBS: ${N_JOBS:--1}
    volumes:
      - ./data/raw:/data/raw:ro
      - ./shared/artifacts:/artifacts

  inference:
    build:
      context: ./inference
      dockerfile: Dockerfile
    image: guardianai-inference:latest
    container_name: guardianai-inference
    restart: unless-stopped
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      ARTIFACTS_DIR: /artifacts
      LOGS_DIR: /logs
      DEFAULT_THRESHOLD: ${DEFAULT_THRESHOLD:-0.5}
      THRESHOLD_OVERRIDE: ${THRESHOLD_OVERRIDE:-}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-1}
    volumes:
      - ./shared/artifacts:/artifacts:ro
      - ./shared/logs:/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: guardianai-prometheus
    restart: unless-stopped
    depends_on:
      - inference
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"

  monitor:
    build:
      context: ./monitoring
      dockerfile: Dockerfile
    image: guardianai-monitor:latest
    container_name: guardianai-monitor
    restart: unless-stopped
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      inference:
        condition: service_healthy
    environment:
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      ARTIFACTS_DIR: /artifacts
      LOGS_DIR: /logs
      API_URL: http://inference:8000
      CHECK_INTERVAL: ${CHECK_INTERVAL:-60}
      CPU_THRESHOLD: ${CPU_THRESHOLD:-80.0}
      RAM_THRESHOLD: ${RAM_THRESHOLD:-80.0}
      DRIFT_Z_THRESHOLD: ${DRIFT_Z_THRESHOLD:-3.0}
      FRAUD_RATE_THRESHOLD: ${FRAUD_RATE_THRESHOLD:-0.10}
      MIN_PREDICTIONS_DRIFT: ${MIN_PREDICTIONS_DRIFT:-30}
      RETRAIN_ON_DRIFT: ${RETRAIN_ON_DRIFT:-false}
      MODEL_F1_THRESHOLD: ${MODEL_F1_THRESHOLD:-0.20}
      MIN_CONFIRMADOS_F1: ${MIN_CONFIRMADOS_F1:-30}
      ALERT_REMINDER_HOURS: ${ALERT_REMINDER_HOURS:-1}
    volumes:
      - ./shared/artifacts:/artifacts:ro
      - ./shared/logs:/logs
      - /var/run/docker.sock:/var/run/docker.sock  # para trigger retrain
